name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The frontend's date labels format with the runtime's default locale (`toLocaleString([], …)`),
# and the tests assert the en-GB 24-hour form ("17:30"). Ubuntu runners default to en-US
# ("05:30 PM"), so pin the locale the tests were written against.
env:
  LANG: en_GB.UTF-8
  LC_ALL: en_GB.UTF-8

# Supersede older runs of the same ref (new push to a PR, or to main).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # --expose-gc: bods-client.test.ts asserts heap retention and skips without global.gc.
      - run: NODE_OPTIONS=--expose-gc npx vitest run

  frontend:
    name: Frontend build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx vitest run
