<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>London Live — 2D Real-Time Transport Map</title>
    <style>
      html, body { height: 100%; margin: 0; background: #0a0a0a; }
      #app { position: fixed; inset: 0; }

      /* iOS Safari zooms the whole PAGE on a quick double-tap — easy to
         trigger on the geolocate button, whose second tap often changes
         nothing visibly (already located). Safari ignores user-scalable=no,
         so opting every element out of double-tap zoom (pinch/pan stay
         allowed) is the supported fix. touch-action does not inherit, hence
         the universal selector; maplibre's own canvas gesture rules are class
         selectors and outrank it, so map handling is untouched. */
      * { touch-action: manipulation; }

      /* ── dark popup theme (vehicle + station boards) ──
         double selector outranks maplibre-gl.css, which is injected later */
      .maplibregl-popup .maplibregl-popup-content {
        background: rgba(16, 18, 22, 0.95);
        color: #ddd;
        border: 1px solid #333;
        border-radius: 6px;
        padding: 10px 12px;
        font: 12px/1.5 system-ui, sans-serif;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
        /* Allow selecting/copying card text on mobile (MapLibre defaults some
           of these off); long-press then yields the native selection menu. */
        user-select: text;
        -webkit-user-select: text;
        -webkit-touch-callout: default;
      }
      .maplibregl-popup .maplibregl-popup-tip { border-top-color: #333 !important; border-bottom-color: #333 !important; }
      .maplibregl-popup .maplibregl-popup-close-button { color: #888; font-size: 16px; right: 4px; top: 2px; }
      .maplibregl-popup .maplibregl-popup-close-button:hover { color: #fff; background: none; }
      .vp { min-width: 170px; }
      .vp-line {
        display: inline-block; padding: 1px 8px; border-radius: 3px;
        color: #fff; font-weight: 600; text-shadow: 0 1px 2px rgba(0,0,0,.5);
        margin-bottom: 4px;
      }
      .vp-dest { font-weight: 600; margin-bottom: 2px; }
      .vp-dim { color: #888; }
      .sp-title { font-weight: 700; margin-bottom: 6px; font-size: 13px; }
      .sp-row { display: flex; align-items: center; gap: 7px; padding: 2px 0; }
      .sp-chip { width: 10px; height: 10px; border-radius: 2px; flex: none; }
      .sp-dest { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .sp-eta { color: #9c9; font-variant-numeric: tabular-nums; }
      .sp-plat { color: #777; font-size: 10px; border: 1px solid #333; border-radius: 3px; padding: 0 3px; }
      .vp-status { color: #da3; margin-top: 4px; }
      .vp-section { color: #777; text-transform: uppercase; font-size: 10px; letter-spacing: .08em; margin-top: 6px; border-top: 1px solid #222; padding-top: 5px; }
      .tip-dest { font-weight: 600; margin-left: 4px; }
      .tip-chips .sp-chip { display: inline-block; margin-left: 3px; vertical-align: baseline; }
      .hover-tip .maplibregl-popup-content { pointer-events: none; padding: 7px 10px; }

      /* ── one-off toast (geolocate notices) ── */
      .map-toast {
        position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%);
        z-index: 6; max-width: min(360px, calc(100vw - 32px));
        background: rgba(16, 18, 22, 0.95); border: 1px solid #333; border-radius: 6px;
        padding: 9px 14px; color: #ddd; font: 12px/1.5 system-ui, sans-serif;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6); text-align: center;
        pointer-events: none; animation: map-toast-in 0.18s ease-out;
      }
      @keyframes map-toast-in {
        from { opacity: 0; transform: translate(-50%, 8px); }
        to { opacity: 1; transform: translate(-50%, 0); }
      }

      /* ── device-heading beam on the geolocate dot ──
         Rotated from JS (main.ts setupHeadingBeam); drawn pointing up so
         rotate(heading - bearing) is the whole transform. Centred on the 15px
         dot so rotation pivots on the dot centre; the radial mask cuts a hole
         over the dot and fades the wedge tip. Hidden until a valid compass
         heading arrives (JS sets opacity). */
      .user-heading-beam {
        position: absolute; left: 50%; top: 50%;
        width: 52px; height: 52px; margin: -26px 0 0 -26px;
        pointer-events: none; opacity: 0; transition: opacity .3s;
        /* ~45° fan straight up, in maplibre's dot blue (#1da1f2) */
        background: conic-gradient(from -22.5deg,
          rgba(29, 161, 242, 0.4) 0deg 45deg, transparent 45deg);
        -webkit-mask: radial-gradient(circle,
          transparent 8px, rgba(0, 0, 0, 0.9) 9px, transparent 26px);
        mask: radial-gradient(circle,
          transparent 8px, rgba(0, 0, 0, 0.9) 9px, transparent 26px);
      }

      /* ── legend panel ──
         top offset keeps clear of the top-right MapLibre stack (now just the
         geolocate button; headroom kept from when zoom + compass lived there
         so the layout did not shift) */
      .legend {
        position: absolute; right: 10px; top: 150px; z-index: 5;
        background: rgba(16, 18, 22, 0.92); border: 1px solid #333; border-radius: 6px;
        font: 11px/1.6 system-ui, sans-serif; color: #ccc; user-select: none;
        max-height: calc(100vh - 220px); display: flex; flex-direction: column;
        box-shadow: 0 4px 16px rgba(0,0,0,.5); width: 148px;
      }
      .legend-header {
        padding: 6px 10px; cursor: pointer; font-weight: 700; letter-spacing: .12em;
        font-size: 10px; color: #888; border-bottom: 1px solid #222;
      }
      .legend-header:hover { color: #fff; }
      .legend-body { overflow-y: auto; padding: 4px 0 6px; }
      .legend.collapsed .legend-body { display: none; }
      .legend-group {
        padding: 5px 10px 1px; color: #666; font-size: 9.5px; text-transform: uppercase;
        letter-spacing: .1em;
      }
      .legend-row {
        display: flex; align-items: center; gap: 7px; padding: 1.5px 10px; cursor: pointer;
        white-space: nowrap;
      }
      .legend-row:hover { background: rgba(255,255,255,.06); }
      .legend-row.off { opacity: 0.32; }
      .legend-row.off .legend-swatch { background: #444 !important; }
      .legend-swatch { width: 14px; height: 5px; border-radius: 2px; flex: none; }

      /* About tab: data sources, licences, acknowledgements */
      .about-note {
        padding: 5px 10px; font-size: 10.5px; line-height: 1.5; color: #9aa;
        white-space: normal; overflow-y: auto;
      }
      .about-note a { color: #6ea8fe; text-decoration: none; }
      .about-note a:hover { text-decoration: underline; }
      .about-credit { margin-bottom: 5px; }

      /* Battery-saver preference row, pinned to the bottom of the Lines tab */
      .legend-saver { border-top: 1px solid #222; margin-top: 5px; padding-top: 3px; }
      .legend-saver-row { justify-content: space-between; }
      .legend-saver-row.off { opacity: 1; } /* keep readable when Off, unlike line rows */
      .legend-saver-label { color: #cfd3d8; }
      .legend-saver-state { font-size: 11px; color: #7fd18b; font-weight: 600; }
      .legend-saver-row.off .legend-saver-state { color: #777; font-weight: 400; }
      .legend-saver-hint { padding: 1px 10px 6px; color: #777; font-size: 10px; line-height: 1.35; white-space: normal; }

      /* ── merged control panel (one panel, docks top-left) ──
         Board / Filter / Lines tabs live here; top-right stays free for the
         MapLibre geolocate control. */
      .control-panel {
        left: 10px; right: auto; top: 10px; width: 224px;
        max-height: calc(100vh - 40px);
      }
      .cp-tabs { display: flex; border-bottom: 1px solid #222; }
      .legend.collapsed .cp-tabs { display: none; }
      .cp-tab {
        flex: 1; text-align: center; padding: 6px 0; cursor: pointer; color: #777;
        font-size: 11px; white-space: nowrap;
      }
      .cp-tab:hover { color: #ccc; background: rgba(255,255,255,.05); }
      .cp-tab.active { color: #fff; box-shadow: inset 0 -2px 0 #6ea8fe; }
      /* Body is a flex column; only the active section shows and it owns the
         internal scroll so the shell never grows past its max-height. */
      .cp-body { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
      .legend.collapsed .cp-body { display: none; }
      .cp-section { flex: 1 1 auto; min-height: 0; display: none; flex-direction: column; overflow: hidden; }
      .cp-section.active { display: flex; }
      .cp-section .legend-body { flex: 1 1 auto; min-height: 0; }

      /* Select all / Unselect all, pinned atop the Lines tab */
      .legend-actions { display: flex; gap: 6px; padding: 6px 10px; border-bottom: 1px solid #222; flex: none; }
      .legend-action {
        flex: 1; background: rgba(255,255,255,.06); color: #bbb;
        border: 1px solid #333; border-radius: 4px; padding: 3px 0;
        font: inherit; font-size: 11px; cursor: pointer;
      }
      .legend-action:hover { background: rgba(255,255,255,.12); color: #fff; }

      /* ── bus line filter (Filter tab) ── */
      .bf-body { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 7px; }
      .bf-hint { color: #888; font-size: 10px; line-height: 1.4; }
      .bf-row { display: flex; gap: 6px; }
      /* min-width:auto would stop the input shrinking below its placeholder;
         stretch overrides .bf-clear's flex-start for the row's Add button. */
      .bf-row .bf-input { min-width: 0; }
      .bf-row .bf-clear { align-self: stretch; }
      .bf-input {
        width: 100%; box-sizing: border-box; background: #101216; color: #ddd;
        border: 1px solid #333; border-radius: 4px; padding: 5px 7px;
        font: 12px/1.4 system-ui, sans-serif;
      }
      .bf-input:focus { outline: none; border-color: #6ea8fe; }
      /* 16px is WebKit's threshold: focusing an input below it auto-zooms the
         page, and the zoom is unrecoverable here because MapLibre swallows the
         pinch gesture that would undo it. Touch pointers only — desktop has no
         auto-zoom, and 12px keeps the input in scale with the rest of the panel. */
      @media (pointer: coarse) {
        .bf-input { font-size: 16px; }
      }
      .bf-chips { display: flex; flex-wrap: wrap; gap: 5px; }
      .bf-chip {
        display: inline-flex; align-items: center; gap: 4px; background: rgba(218,44,67,.16);
        border: 1px solid #DA2C43; color: #f2c3c9; border-radius: 10px; padding: 1px 4px 1px 8px;
        font-size: 11px; font-weight: 600;
      }
      .bf-chip-x {
        background: none; border: none; color: #f2c3c9; cursor: pointer;
        font-size: 13px; line-height: 1; padding: 0 2px;
      }
      .bf-chip-x:hover { color: #fff; }
      .bf-feedback { color: #9c9; font-size: 10px; font-variant-numeric: tabular-nums; }
      .bf-note {
        color: #b9975b; font-size: 10px; line-height: 1.4;
        border-left: 2px solid #4a3f26; padding-left: 6px;
      }
      .bf-clear {
        align-self: flex-start; background: none; border: 1px solid #333; color: #aaa;
        border-radius: 4px; padding: 3px 9px; cursor: pointer; font: 10px/1 system-ui, sans-serif;
      }
      .bf-clear:hover:not(:disabled) { color: #fff; border-color: #555; }
      .bf-clear:disabled { opacity: .4; cursor: default; }

      .lb-tabs { display: flex; border-bottom: 1px solid #222; }
      .legend.collapsed .lb-tabs { display: none; }
      .lb-tab {
        flex: 1; text-align: center; padding: 4px 0; cursor: pointer; color: #777;
        font-size: 10px; letter-spacing: .06em; text-transform: uppercase;
      }
      .lb-tab:hover { color: #ccc; background: rgba(255,255,255,.05); }
      .lb-tab.active { color: #fff; box-shadow: inset 0 -2px 0 #6ea8fe; }
      .lb-modes .lb-tab { text-transform: none; letter-spacing: 0; }
      .lb-row { gap: 6px; padding: 2px 10px; cursor: default; user-select: none; }
      .lb-rank { width: 15px; text-align: right; color: #777; font-variant-numeric: tabular-nums; flex: none; }
      .lb-chip { width: 10px; height: 10px; border-radius: 3px; }
      .lb-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .lb-km { color: #9c9; font-variant-numeric: tabular-nums; }
      .lb-total { padding: 5px 10px 2px; color: #666; font-size: 10px; }
      .lb-empty { padding: 8px 10px; color: #666; }
      .lb-km.lb-not-running { color: #777; font-style: italic; }
      /* short-lived highlight dropped on a located vehicle; the anchor is the
         maplibre marker element (positioned via transform), the ripple child
         carries the scale animation so the two transforms never collide */
      .lb-pulse-anchor { width: 0; height: 0; position: relative; pointer-events: none; }
      .lb-pulse {
        position: absolute; left: -9px; top: -9px;
        width: 18px; height: 18px; border-radius: 50%;
        border: 3px solid #6ea8fe; background: rgba(110, 168, 254, .25);
        animation: lb-pulse 1s ease-out infinite; pointer-events: none;
      }
      @keyframes lb-pulse {
        0% { transform: scale(.6); opacity: 1; }
        100% { transform: scale(2.4); opacity: 0; }
      }

      /* ── phones (portrait) ──
         The single merged panel starts collapsed (see control-panel.ts) so the
         map is visible; even when expanded it is capped so it never fully covers
         the map, and its active section scrolls internally. */
      @media (max-width: 640px) {
        .control-panel {
          max-width: 72vw;
          max-height: 70vh;
          box-sizing: border-box;
        }
        /* comfortable touch target for the collapsed header bar */
        .legend-header {
          min-height: 40px;
          display: flex;
          align-items: center;
          box-sizing: border-box;
        }
        /* Popups are NOT internally scrolled on mobile: with drag-to-pan the
           whole card is reachable by panning the map. Let them size to content
           (no max-height/overflow-y clip); keep a generous width for reading. */
        .maplibregl-popup .maplibregl-popup-content {
          max-height: none;
          overflow: visible;
          max-width: 80vw;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
